# =============================================================================
# Release — version, publish image, then tag
# =============================================================================
# Every push to main creates the next version from Conventional Commits:
#
#   feat: ...                      -> minor  (0.1.0 -> 0.2.0)
#   fix: ... / chore: ... / etc.   -> patch  (0.2.0 -> 0.2.1)
#   feat!: ... / BREAKING CHANGE:  -> major  (0.2.0 -> 1.0.0)
#
# The image is published to GitHub Container Registry using the automatic
# GITHUB_TOKEN, so no Docker Hub credentials are involved and there is no
# long-lived registry secret to leak or rotate.
#
# ORDERING IS THE POINT: the image is pushed BEFORE the Git tag is created.
# The deployment watches the repository tag, so tagging first would advertise a
# version whose image does not exist yet and the deploy would fail on a pull
# that cannot succeed. Publishing first makes "a tag exists" imply "a matching
# image exists". If the publish fails, no tag is created and no deploy is
# triggered.
# =============================================================================
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto follows Conventional Commits)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write   # create the git tag and the GitHub Release
  packages: write   # push the image to ghcr.io

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Version, publish image and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          FORCED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          [ -z "$last" ] && last="v0.0.0"

          base="${last#v}"
          IFS='.' read -r major minor patch <<< "$base"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          if git rev-parse -q --verify "refs/tags/${last}" >/dev/null 2>&1; then
            range="${last}..HEAD"
          else
            range="HEAD"
          fi
          messages="$(git log "$range" --pretty=format:'%s%n%b')"

          bump="patch"
          if printf '%s\n' "$messages" | grep -qE '(BREAKING CHANGE:|^[a-zA-Z]+(\([^)]*\))?!:)'; then
            bump="major"
          elif printf '%s\n' "$messages" | grep -qE '^feat(\([^)]*\))?:'; then
            bump="minor"
          fi
          if [ -n "${FORCED_BUMP:-}" ] && [ "${FORCED_BUMP}" != "auto" ]; then
            bump="${FORCED_BUMP}"
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac

          version="${major}.${minor}.${patch}"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Next release: ${tag} (${bump})"

      # ------------------------------------------------------------------
      # Publish the image FIRST. Nothing below may run if this fails, so the
      # tag can never advertise an image that does not exist.
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.version.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.version.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          # Single architecture on purpose. See the note at the bottom of this
          # file: adding arm64 here without native runners makes the release
          # path take half an hour.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Attaches an SLSA provenance statement and an SBOM to the manifest,
          # so what was built and from what is verifiable after the fact.
          provenance: true
          sbom: true
          # The agent signing key is a BuildKit secret, so the private key never
          # enters a layer. Without it the agent still builds but refuses
          # auto-update, which is fail-closed by design.
          secrets: |
            agent_update_key=${{ secrets.AGENT_UPDATE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release"
            echo ""
            echo "- version: \`${VERSION:-unknown}\`"
            echo "- image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION:-unknown}\`"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # ------------------------------------------------------------------
      # Tag only after the image is in the registry. These steps are what the
      # deployment watches.
      # ------------------------------------------------------------------
      - name: Create tag
        if: steps.version.outputs.exists == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

# -----------------------------------------------------------------------------
# Why this builds linux/amd64 only
# -----------------------------------------------------------------------------
# Adding linux/arm64 here looks harmless and is not. GitHub's amd64 runners have
# no arm64 hardware, so buildx runs the arm64 stages under QEMU emulation. The
# Go stages survive that (about 8s each, Go cross-compiles natively with
# CGO_ENABLED=0), but the web stage runs `npm ci` under emulation and took over
# 20 minutes on its own. A release is not the place for that: the deployment is
# x86_64 and needs exactly one architecture.
#
# The web stage produces a static JS/CSS bundle and does not depend on the
# target architecture at all. If arm64 is ever required, the fix is not to add
# the platform here, it is one of:
#
#   1. Build the dashboard once on the runner and only cross-compile the Go
#      binaries per platform (Go already handles this natively), or
#   2. Use a native arm64 runner (GitHub's `ubuntu-24.04-arm`) and join the
#      images with `docker buildx imagetools create`.
#
# Both avoid emulating Node entirely. Until there is a real arm64 target, the
# added build cost buys nothing.
