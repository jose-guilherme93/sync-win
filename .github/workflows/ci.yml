name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Go: Lint (server + agent)
  # ---------------------------------------------------------------------------
  lint-go:
    name: Lint Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Only new issues fail the build, so the existing backlog does not block
      # changes while it is paid down over time.
      - name: Lint ${{ matrix.module }}
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          only-new-issues: true

  # ---------------------------------------------------------------------------
  # Go: Test (server + agent)
  # ---------------------------------------------------------------------------
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test server
        run: cd server && go test -race -count=1 ./...

      - name: Test agent
        run: cd agent && go test -race -count=1 ./...

  # ---------------------------------------------------------------------------
  # Go: Build verification
  # ---------------------------------------------------------------------------
  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server
        run: cd server && CGO_ENABLED=0 go build -o /dev/null ./cmd/server

      - name: Build agent
        run: cd agent && CGO_ENABLED=0 go build -o /dev/null ./cmd/agent

  # ---------------------------------------------------------------------------
  # Web: Build + Type-check
  # ---------------------------------------------------------------------------
  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Unit tests
        run: cd web && npm run test

      - name: Type-check
        run: cd web && npm run check

      - name: Build
        run: cd web && npm run build

  # ---------------------------------------------------------------------------
  # Docker: Build verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-go, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          load: true
          tags: sync-win:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify healthcheck
        run: |
          docker run -d --name sync-win-test -p 8080:8080 \
            -e SYNCWIN_ENV=development \
            -e SYNCWIN_SECRET_KEY=test-key-for-ci-only-1234 \
            sync-win:test
          sleep 5
          curl -fs http://localhost:8080/health || (docker logs sync-win-test && exit 1)
          docker stop sync-win-test

      # The release publishes an image and the repository keeps a buildable
      # Dockerfile, and both paths have to keep working. A wrong default or a
      # broken interpolation in compose.prod.yaml would only surface at deploy
      # time, when the tag already exists and the deploy fails on a pull.
      - name: Verify the production compose file resolves for both paths
        run: |
          set -euo pipefail
          export SYNCWIN_SECRET_KEY=ci-validation-key-not-a-real-secret

          # Path A: build from source. The build section must still be present.
          docker compose -f compose.prod.yaml config | grep -q 'dockerfile: docker/Dockerfile.server'
          echo "path A (build): OK"

          # Path B: pull a pinned image. The tag must reach the image reference.
          ref=$(IMAGE_TAG=9.9.9 docker compose -f compose.prod.yaml config \
            | awk '/^ *image: /{print $2; exit}')
          echo "resolved image with IMAGE_TAG=9.9.9: ${ref}"
          case "$ref" in
            *:9.9.9) echo "path B (pull): OK" ;;
            *) echo "IMAGE_TAG did not reach the image reference: ${ref}" >&2; exit 1 ;;
          esac

          # The agent signing key is optional at build time: without it the agent
          # still builds and refuses auto-update, which is fail-closed. A failure
          # here would mean the build now requires a secret that CI does not have.
          docker compose -f compose.prod.yaml config | grep -q 'SYNCWIN_DATA_DIR: /data'
          echo "data dir: OK"

  # ---------------------------------------------------------------------------
  # Browser end-to-end
  # ---------------------------------------------------------------------------
  # Unit tests, `vite build` and `svelte-check` all passed while the dashboard
  # had a dead Packages screen and had never been opened. This job runs the one
  # check that sees layout and the assembled request path.
  #
  # It builds and starts the dev stack, which is the same one `make dev-d` uses,
  # so it exercises the real Vite proxy rather than a test harness.
  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    # The dev stack brings up Postgres-free SQLite and the Vite dev server; the
    # suite drives a real Chrome over CDP.
    timeout-minutes: 30
    needs: [web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install agent-browser and Chrome
        run: |
          npm i -g agent-browser
          agent-browser install --with-deps

      - name: Start the dev stack
        # data-dev is gitignored, so a fresh checkout does not have it. The
        # Makefile creates it before `up` for the same reason; letting Docker
        # create a missing bind-mount source is a needless difference from the
        # local workflow.
        run: |
          mkdir -p data-dev
          docker compose -f compose.dev.yaml up -d --build

      - name: Wait for the server and dashboard
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:8088/health >/dev/null 2>&1 \
               && curl -fs http://localhost:5173/ >/dev/null 2>&1; then
              echo "Stack ready."
              exit 0
            fi
            sleep 5
          done
          echo "Stack did not become ready in time." >&2
          docker compose -f compose.dev.yaml logs --no-color
          exit 1

      - name: Run the browser suite
        run: scripts/e2e.sh

      # Container logs are the only place a server-side 5xx or a proxy error will
      # show up, and they are gone once the job ends.
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f compose.dev.yaml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f compose.dev.yaml down -v
