# =============================================================================
# SyncWin — development stack
# =============================================================================
# Brings up the whole application in containers with hot reload:
#   server : Go server rebuilt by air on every change (host port 8088)
#   web    : Vite dev server with HMR (port 5173)
#
# The dashboard in dev is served by Vite at http://localhost:5173 and talks to
# the API at http://localhost:8088 (same hostname, dev port 8088 — see App.svelte).
#
# Usage: make dev
# =============================================================================
name: sync-win-dev

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.dev
    init: true
    ports:
      - "${DEV_HTTP_PORT:-8088}:8080"
    environment:
      SYNCWIN_ENV: development
      SYNCWIN_SECRET_KEY: "${SYNCWIN_SECRET_KEY:-dev-insecure-key-not-for-production}"
      # Dashboard session lifetime. Default 720h = 30 days.
      SYNCWIN_SESSION_TTL_HOURS: "${SYNCWIN_SESSION_TTL_HOURS:-720}"
      SYNCWIN_ENABLE_FINGERPRINT_RECONNECT: "${SYNCWIN_ENABLE_FINGERPRINT_RECONNECT:-false}"
      SYNCWIN_ENABLE_LEGACY_INSTALL: "${SYNCWIN_ENABLE_LEGACY_INSTALL:-false}"
      SYNCWIN_ENABLE_REMOTE_MUTATIONS: "${SYNCWIN_ENABLE_REMOTE_MUTATIONS:-false}"
      SYNCWIN_ENABLE_DOCKER_MUTATIONS: "${SYNCWIN_ENABLE_DOCKER_MUTATIONS:-false}"
      # Comma-separated allowlist. The Vite dev server is reachable as both
      # localhost and 127.0.0.1, which the browser treats as distinct origins;
      # listing one of them made the other fail CORS on login.
      SYNCWIN_CORS_ALLOWED_ORIGIN: "http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}"
      SYNCWIN_HTTPS: "false"
      SYNCWIN_TRUST_PROXY: "${SYNCWIN_TRUST_PROXY:-false}"
      SYNCWIN_DATA_DIR: /data
      SYNCWIN_HTTP_ADDR: ":8080"
      # Kept in sync with agent/internal/contract/contract.json by the Makefile.
      SYNCWIN_AGENT_VERSION: "${SYNCWIN_AGENT_VERSION:-0.6.1}"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      LOG_CONSOLE_LEVEL: "${LOG_CONSOLE_LEVEL:-INFO}"
    volumes:
      - ./server:/src/server
      - ./data-dev:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    init: true
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # The browser talks to the API through the Vite proxy, so it uses
      # same-origin relative URLs and no CORS preflight is involved.
      # VITE_PROXY_TARGET is where the proxy inside this container forwards to,
      # which is the compose service address, not a host port.
      VITE_PROXY_TARGET: "http://server:8080"
      # Still used by the install command shown in the dashboard, which has to
      # point the agent at an address reachable from outside the browser.
      VITE_API_BASE: "http://localhost:${DEV_HTTP_PORT:-8088}"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  web_node_modules:
    driver: local
