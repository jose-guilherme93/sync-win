# =============================================================================
# LEM — production stack
# =============================================================================
# Single built image serving both the API and the compiled dashboard.
# Data is persisted in ./data (same directory as the default compose.yaml), so
# switching between stacks keeps every device, file and audit.
#
# Requires LEM_SECRET_KEY in .env (see .env.example). Create it with:
#   make env
#
# Usage: make prod
# =============================================================================
services:
  server:
    image: ${IMAGE_NAME:-linux-environment-manager}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    init: true
    ports:
      - "${LEM_HTTP_PORT:-8080}:8080"
    environment:
      LEM_ENV: "${LEM_ENV:-production}"
      LEM_SECRET_KEY: "${LEM_SECRET_KEY:?Set LEM_SECRET_KEY in .env (run 'make secret')}"
      # Dashboard session lifetime. Default 720h = 30 days.
      LEM_SESSION_TTL_HOURS: "${LEM_SESSION_TTL_HOURS:-720}"
      LEM_HTTP_ADDR: ":8080"
      LEM_DATA_DIR: /data
      LEM_WEB_DIR: /app/web
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_CONSOLE_LEVEL: "${LOG_CONSOLE_LEVEL:-WARN}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
