# air configuration for local development (used by docker/Dockerfile.server.dev).
# Builds and restarts the server whenever Go sources change.
root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/server ./cmd/server"
  bin = "/tmp/air/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "data", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true
