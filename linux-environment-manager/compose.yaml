services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      network: host
    init: true
    ports:
      - "8080:8080"
    environment:
      LEM_ENV: development
      LEM_SECRET_KEY: "${LEM_SECRET_KEY:-dev-insecure-key-not-for-production}"
      LOG_CONSOLE_LEVEL: INFO
    volumes:
      - ./data:/data
    working_dir: /app
    command: ["/app/server"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
