# =============================================================================
# LEM — development stack
# =============================================================================
# Brings up the whole application in containers with hot reload:
#   server : Go server rebuilt by air on every change (port 8080)
#   web    : Vite dev server with HMR (port 5173)
#
# The dashboard in dev is served by Vite at http://localhost:5173 and talks to
# the API at http://localhost:8080 (same hostname, port 8080 — see App.svelte).
#
# Usage: make dev
# =============================================================================
name: lem-dev

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.dev
    init: true
    ports:
      - "${LEM_HTTP_PORT:-8080}:8080"
    environment:
      LEM_ENV: development
      LEM_SECRET_KEY: "${LEM_SECRET_KEY:-dev-insecure-key-not-for-production}"
      # Dashboard session lifetime. Default 720h = 30 days.
      LEM_SESSION_TTL_HOURS: "${LEM_SESSION_TTL_HOURS:-720}"
      LEM_DATA_DIR: /data
      LEM_HTTP_ADDR: ":8080"
      # Kept in sync with agent/internal/contract/contract.json by the Makefile.
      LEM_AGENT_VERSION: "${LEM_AGENT_VERSION:-0.6.1}"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      LOG_CONSOLE_LEVEL: "${LOG_CONSOLE_LEVEL:-INFO}"
    volumes:
      - ./server:/src/server
      - ./data-dev:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    init: true
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # Point the Vite dev server at the dev API port so a non-default
      # LEM_HTTP_PORT keeps working.
      VITE_API_BASE: "http://localhost:${LEM_HTTP_PORT:-8080}"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  web_node_modules:
    driver: local
