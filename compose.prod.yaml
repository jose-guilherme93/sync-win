# =============================================================================
# SyncWin — production stack
# =============================================================================
# Single image serving both the API and the compiled dashboard, published by the
# Release workflow to Docker Hub and mirrored to GitHub Container Registry.
# Universal: works with plain Docker Compose, Dokploy, Coolify or any platform
# that runs a Compose file.
#
# The deployment follows the Git tag, and the Release workflow publishes the
# image before creating that tag, so a tag always has a matching image.
#
# Docker Hub is where users pull from, and it is the default:
#   docker.io/joseguilherme93/sync-win:<version>
# The same `0.6.4`, `v0.6.4` and `latest` tags are mirrored to
# ghcr.io/jose-guilherme93/sync-win, which needs no credentials on either side
# (the Release workflow authenticates with the automatic GITHUB_TOKEN) and is
# what keeps a release from failing if the Docker Hub secret is ever rotated.
#
# Override with IMAGE_NAME to run your own build or a different registry.
#
# The `build:` section stays so `make prod` works from a checkout without a
# registry. A platform that only pulls from a registry can drop it.
#
# Data is kept in the named volume "sync-win-data" so it survives redeploys.
# Set SYNCWIN_DATA_PATH=./data to use a host bind mount instead (matching the
# simple compose.yaml).
#
# Requires SYNCWIN_SECRET_KEY in .env (see .env.example). Create it with:
#   make env
#
# Usage: make prod
# =============================================================================
services:
  server:
    image: ${IMAGE_NAME:-docker.io/joseguilherme93/sync-win}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    init: true
    ports:
      - "${SYNCWIN_HTTP_PORT:-8080}:8080"
    environment:
      SYNCWIN_ENV: "${SYNCWIN_ENV:-production}"
      SYNCWIN_SECRET_KEY: "${SYNCWIN_SECRET_KEY:?Set SYNCWIN_SECRET_KEY in .env (run 'make secret')}"
      # Dashboard session lifetime. Default 720h = 30 days.
      SYNCWIN_SESSION_TTL_HOURS: "${SYNCWIN_SESSION_TTL_HOURS:-720}"
      SYNCWIN_ENABLE_FINGERPRINT_RECONNECT: "${SYNCWIN_ENABLE_FINGERPRINT_RECONNECT:-false}"
      SYNCWIN_ENABLE_LEGACY_INSTALL: "${SYNCWIN_ENABLE_LEGACY_INSTALL:-false}"
      SYNCWIN_ENABLE_REMOTE_MUTATIONS: "${SYNCWIN_ENABLE_REMOTE_MUTATIONS:-false}"
      SYNCWIN_ENABLE_DOCKER_MUTATIONS: "${SYNCWIN_ENABLE_DOCKER_MUTATIONS:-false}"
      SYNCWIN_ENABLE_REGISTRATION: "${SYNCWIN_ENABLE_REGISTRATION:-false}"
      SYNCWIN_ADMIN_EMAIL: "${SYNCWIN_ADMIN_EMAIL:-}"
      SYNCWIN_ADMIN_PASSWORD: "${SYNCWIN_ADMIN_PASSWORD:-}"
      SYNCWIN_CORS_ALLOWED_ORIGIN: "${SYNCWIN_CORS_ALLOWED_ORIGIN:-}"
      SYNCWIN_HTTPS: "${SYNCWIN_HTTPS:-false}"
      SYNCWIN_TRUST_PROXY: "${SYNCWIN_TRUST_PROXY:-false}"
      SYNCWIN_HTTP_ADDR: ":8080"
      SYNCWIN_DATA_DIR: /data
      SYNCWIN_WEB_DIR: /app/web
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_CONSOLE_LEVEL: "${LOG_CONSOLE_LEVEL:-WARN}"
    volumes:
      - ${SYNCWIN_DATA_PATH:-sync-win-data}:/data
    healthcheck:
      # wget is part of busybox in the image; curl is deliberately not installed.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sync-win-data:
    name: sync-win-data
