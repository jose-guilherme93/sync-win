# =============================================================================
# SyncWin — production stack
# =============================================================================
# Single built image serving both the API and the compiled dashboard.
# Universal: works with plain Docker Compose, Dokploy, Coolify or any platform
# that runs a Compose file.
#
# Data is kept in the named volume "sync-win-data" so it survives redeploys.
# Set SYNCWIN_DATA_PATH=./data to use a host bind mount instead (matching the
# simple compose.yaml).
#
# Requires SYNCWIN_SECRET_KEY in .env (see .env.example). Create it with:
#   make env
#
# Usage: make prod
# =============================================================================
services:
  server:
    image: ${IMAGE_NAME:-sync-win}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    init: true
    ports:
      - "${SYNCWIN_HTTP_PORT:-8080}:8080"
    environment:
      SYNCWIN_ENV: "${SYNCWIN_ENV:-production}"
      SYNCWIN_SECRET_KEY: "${SYNCWIN_SECRET_KEY:?Set SYNCWIN_SECRET_KEY in .env (run 'make secret')}"
      # Dashboard session lifetime. Default 720h = 30 days.
      SYNCWIN_SESSION_TTL_HOURS: "${SYNCWIN_SESSION_TTL_HOURS:-720}"
      SYNCWIN_ENABLE_FINGERPRINT_RECONNECT: "${SYNCWIN_ENABLE_FINGERPRINT_RECONNECT:-false}"
      SYNCWIN_ENABLE_LEGACY_INSTALL: "${SYNCWIN_ENABLE_LEGACY_INSTALL:-false}"
      SYNCWIN_ENABLE_REMOTE_MUTATIONS: "${SYNCWIN_ENABLE_REMOTE_MUTATIONS:-false}"
      SYNCWIN_ENABLE_DOCKER_MUTATIONS: "${SYNCWIN_ENABLE_DOCKER_MUTATIONS:-false}"
      SYNCWIN_ENABLE_REGISTRATION: "${SYNCWIN_ENABLE_REGISTRATION:-false}"
      SYNCWIN_ADMIN_EMAIL: "${SYNCWIN_ADMIN_EMAIL:-}"
      SYNCWIN_ADMIN_PASSWORD: "${SYNCWIN_ADMIN_PASSWORD:-}"
      SYNCWIN_CORS_ALLOWED_ORIGIN: "${SYNCWIN_CORS_ALLOWED_ORIGIN:-}"
      SYNCWIN_HTTPS: "${SYNCWIN_HTTPS:-false}"
      SYNCWIN_TRUST_PROXY: "${SYNCWIN_TRUST_PROXY:-false}"
      SYNCWIN_HTTP_ADDR: ":8080"
      SYNCWIN_DATA_DIR: /data
      SYNCWIN_WEB_DIR: /app/web
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_CONSOLE_LEVEL: "${LOG_CONSOLE_LEVEL:-WARN}"
    volumes:
      - ${SYNCWIN_DATA_PATH:-sync-win-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sync-win-data:
    name: sync-win-data
